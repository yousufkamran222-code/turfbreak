name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit, invariant, determinism and golden-hash tests.
      - run: npm test
      # 100 seeds x 2 sides = 200 headless matches, both sides on the rival controller,
      # with invariants checked on every step.
      - run: npm run lab -- --seeds 100 --smoke --control rival:rival
      - run: npm run build:web
      - run: npm run check:size
      # Fast UI smoke: one match in headless Chromium against vite preview (about a minute).
      - run: npx playwright install chromium --with-deps
      - run: node tools/ui-smoke.mjs --fast --shots ui-smoke-shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-smoke-screenshots
          path: ui-smoke-shots
          if-no-files-found: ignore
